<text x="32" y="14" font-size="12.75" font-weight="500" letter-spacing="0.08em" class="mono" style="fill:#4c4b45">BEFORE THE PULL REQUEST</text>
<text x="32" y="39" font-size="14" font-weight="500" style="fill:#141413">The work is verified</text>
<text x="32" y="57" font-size="13" style="fill:#4c4b45">Claude runs the tests, build and linter; a</text>
<text x="32" y="74" font-size="13" style="fill:#4c4b45">second agent reviews the diff in a fresh</text>
<text x="32" y="91" font-size="13" style="fill:#4c4b45">context</text>
<text x="32" y="127" font-size="12.75" font-weight="500" letter-spacing="0.08em" class="mono" style="fill:#4c4b45">ON EVERY PULL REQUEST</text>
<text x="32" y="152" font-size="14" font-weight="500" style="fill:#141413">Required CI</text>
<text x="32" y="170" font-size="13" style="fill:#4c4b45">Lint, types, tests across platforms, build</text>
<text x="32" y="187" font-size="13" style="fill:#4c4b45">and packaging. Red blocks the merge</text>
<text x="32" y="215" font-size="14" font-weight="500" style="fill:#141413">Claude code review</text>
<text x="32" y="233" font-size="13" style="fill:#4c4b45">Agents hunt for bugs in parallel, verifiers</text>
<text x="32" y="250" font-size="13" style="fill:#4c4b45">vote on each finding, survivors ranked by</text>
<text x="32" y="267" font-size="13" style="fill:#4c4b45">severity</text>
<text x="32" y="295" font-size="14" font-weight="500" style="fill:#141413">Security review</text>
<text x="32" y="313" font-size="13" style="fill:#4c4b45">A separate pass. Open findings from either</text>
<text x="32" y="330" font-size="13" style="fill:#4c4b45">review block the merge</text>
<text x="32" y="358" font-size="14" font-weight="500" style="fill:#141413">Risk-based approval</text>
<text x="32" y="376" font-size="13" style="fill:#4c4b45">A classifier sets the tier: no person, one, or</text>
<text x="32" y="393" font-size="13" style="fill:#4c4b45">two. Some paths always need a person</text>
<text x="32" y="429" font-size="12.75" font-weight="500" letter-spacing="0.08em" class="mono" style="fill:#4c4b45">MERGING</text>
<text x="32" y="454" font-size="14" font-weight="500" style="fill:#141413">Merge queue</text>
<text x="32" y="472" font-size="13" style="fill:#4c4b45">Checks run again on the latest main with</text>
<text x="32" y="489" font-size="13" style="fill:#4c4b45">the change applied</text>
<text x="32" y="525" font-size="12.75" font-weight="500" letter-spacing="0.08em" class="mono" style="fill:#4c4b45">AFTER THE MERGE</text>
<text x="32" y="550" font-size="14" font-weight="500" style="fill:#141413">Behind a flag, used internally first</text>
<text x="32" y="568" font-size="13" style="fill:#4c4b45">Anthropic employees run it before it</text>
<text x="32" y="585" font-size="13" style="fill:#4c4b45">reaches everyone</text>
<text x="32" y="613" font-size="14" font-weight="500" style="fill:#141413">Gradual release</text>
<text x="32" y="631" font-size="13" style="fill:#4c4b45">The latest channel first; the stable channel</text>
<text x="32" y="648" font-size="13" style="fill:#4c4b45">trails it</text>
<text x="32" y="676" font-size="14" font-weight="500" style="fill:#141413">Watch, fix forward or roll back</text>
<text x="32" y="694" font-size="13" style="fill:#4c4b45">The author and on-call watch; flags turn off</text>
<text x="32" y="711" font-size="13" style="fill:#4c4b45">quickly, broken builds get reverted</text>
